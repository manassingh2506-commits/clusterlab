<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClusterLab: k-means demo</title><style>
:root{--bg:#faf8f4;--card:#fffefb;--ink:#0e2745;--mute:#5a6678;--line:#e4dfd3;--blue:#2563b8;--sky:#6fb2ea;--teal:#1d9a8f;--red:#d9534f;--tint:#f1eee7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
nav b{font-family:'Bricolage Grotesque',sans-serif;font-size:19px}nav div{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
nav a{text-decoration:none;font-size:15px;color:var(--mute);white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}nav a.on,nav a:hover{color:var(--ink);border-color:var(--blue)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 64px}
.hero h1{font-size:clamp(54px,9vw,104px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--mute);max-width:46ch}.role{font-weight:600;margin:14px 0 8px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;border:1.5px solid var(--ink);font-weight:600;text-decoration:none;font-size:15px;background:none;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.p{background:var(--ink);color:var(--bg)}.btn:focus-visible,a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.frame{position:relative;max-width:380px;margin:0 auto}
.arch{border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--tint);aspect-ratio:3/4;border:6px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.frame svg.ov{display:none}
.chip{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.3;box-shadow:0 6px 20px rgba(14,39,69,.12)}
.chip b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;color:var(--blue)}
section{padding:68px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(32px,5vw,46px);font-weight:800;letter-spacing:-.02em}.sub{color:var(--mute);margin:8px 0 34px}
.demo{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:240px 1fr;gap:24px}
.demo canvas{width:100%;height:auto;aspect-ratio:13/8;background:var(--bg);border-radius:12px;border:1px solid var(--line);cursor:crosshair;touch-action:manipulation}
.ctl{display:flex;flex-direction:column;gap:12px}.ctl .row{display:flex;gap:8px;flex-wrap:wrap}.ctl button.k{padding:6px 14px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit}.ctl button.k[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
#msg{color:var(--mute);font-size:15px}
.about{display:grid;grid-template-columns:1.5fr 1fr;gap:40px}.about p{max-width:62ch}
.facts{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;align-self:start}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}.facts dt{color:var(--mute)}.facts dd{margin:0}
.facts ul{padding-left:18px;margin:8px 0 0;font-size:15px}.facts li::marker{color:var(--sky)}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;padding:34px 0;border-top:1px dashed var(--line)}.proj:first-of-type{border-top:0}
.proj:nth-of-type(even) .gfx{order:2}.gfx{background:var(--tint);border-radius:22px;padding:18px}.gfx svg{width:100%;height:auto;display:block}
.gfx figcaption{font-size:13px;color:var(--mute);text-align:center;margin-top:8px}.gfx{margin:0}
.proj h3{font-size:34px;margin:4px 0 10px}.kind{color:var(--blue);font-weight:600;font-size:15px}
.pr{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;font-size:15px;margin:12px 0}.pr b{font-weight:600}.pr span{color:var(--mute)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tags i{font-style:normal;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px}summary{cursor:pointer;font-weight:600}details p{color:var(--mute);margin:10px 0 0}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.sk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.sk h3{font-size:21px;margin-bottom:10px}.sk div{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0;border-top:1px solid var(--line)}.sk span{color:var(--mute);text-align:right}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:24px;display:grid;gap:26px}.tl article{position:relative}.tl article::before{content:"";position:absolute;left:-32px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--bg)}
.tl time{color:var(--blue);font-weight:600;font-size:14px}.tl h3{font-size:20px}.tl p{margin:4px 0 0;color:var(--mute);font-size:15px}
.res{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}
.contact{background:var(--ink);color:var(--bg);border-radius:24px;padding:44px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px}
.contact h2{color:var(--bg)}.contact p{opacity:.8}.contact .btn{border-color:var(--bg);color:var(--bg)}.contact .btn.p{background:var(--bg);color:var(--ink)}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px;text-align:center}
@media(max-width:820px){.hero,.about,.res,.proj,.demo,.contact{grid-template-columns:1fr}.proj:nth-of-type(even) .gfx{order:0}.hero{padding-top:32px}.frame{max-width:300px}.contact{padding:28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main><section id="demo"><div class="wrap"><h2>Try it: let the algorithm find groups</h2><p class="sub">Click the canvas to add points, choose how many groups, then press Cluster.</p>
<div class="demo"><div class="ctl"><div class="row" role="group" aria-label="Number of groups"><button class="k" data-k="2" aria-pressed="false">2 groups</button><button class="k" data-k="3" aria-pressed="true">3 groups</button><button class="k" data-k="4" aria-pressed="false">4 groups</button></div>
<button class="btn p" id="go">Cluster</button><button class="btn" id="rs">Reset points</button><p id="msg" aria-live="polite">Click to add points.</p></div><canvas id="cv" width="650" height="400" aria-label="Clustering canvas"></canvas></div></div></section></main><script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),msg=document.getElementById('msg');let K=3,P=[],C=[],asg=[],busy=false;
const col=['#2563b8','#6fb2ea','#1d9a8f','#8a6fd1'];
function blob(cx,cy,n){for(let i=0;i<n;i++)P.push([cx+(Math.random()+Math.random()+Math.random()-1.5)*70,cy+(Math.random()+Math.random()+Math.random()-1.5)*70])}
function seed(){P=[];C=[];asg=[];blob(150,120,16);blob(470,110,16);blob(300,300,16);msg.textContent='Click to add points.';draw()}
function draw(){x.clearRect(0,0,650,400);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');x.lineWidth=1;for(let i=0;i<650;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,400);x.stroke()}for(let i=0;i<400;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(650,i);x.stroke()}
P.forEach((p,i)=>{x.fillStyle=asg[i]==null?'#7f93ab':col[asg[i]];x.beginPath();x.arc(p[0],p[1],6,0,7);x.fill()});
C.forEach((c,i)=>{x.fillStyle='#fff';x.strokeStyle='#0e2745';x.lineWidth=3;x.beginPath();x.arc(c[0],c[1],10,0,7);x.fill();x.stroke();x.fillStyle=col[i];x.beginPath();x.arc(c[0],c[1],5,0,7);x.fill()})}
function d(a,b){return(a[0]-b[0])**2+(a[1]-b[1])**2}
function init(){C=[P[Math.floor(Math.random()*P.length)].slice()];while(C.length<K){let w=P.map(p=>Math.min(...C.map(c=>d(p,c)))),s=w.reduce((a,b)=>a+b,0),r=Math.random()*s,i=0;while(r>w[i]&&i<P.length-1){r-=w[i];i++}C.push(P[i].slice())}}
function step(){const old=asg.join();asg=P.map(p=>{let b=0;C.forEach((c,i)=>{if(d(p,c)<d(p,C[b]))b=i});return b});C=C.map((c,i)=>{const m=P.filter((p,j)=>asg[j]==i);return m.length?[m.reduce((s,p)=>s+p[0],0)/m.length,m.reduce((s,p)=>s+p[1],0)/m.length]:c});return old!=asg.join()}
document.getElementById('go').onclick=async()=>{if(busy||P.length<K){msg.textContent='Add at least '+K+' points first.';return}busy=true;asg=[];init();draw();let n=0;while(n<30){await new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion:reduce)').matches?0:450));n++;const ch=step();draw();msg.textContent='Step '+n+': assigning points and moving centres.';if(!ch)break}msg.textContent='Found '+K+' groups in '+n+' steps.';busy=false};
document.getElementById('rs').onclick=()=>{if(!busy)seed()};
cv.onclick=e=>{if(busy)return;const r=cv.getBoundingClientRect();P.push([(e.clientX-r.left)*650/r.width,(e.clientY-r.top)*400/r.height]);asg=[];C=[];draw()};
document.querySelectorAll('.k').forEach(b=>b.onclick=()=>{document.querySelectorAll('.k').forEach(o=>o.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');K=+b.dataset.k});
seed();
</script></body></html>
